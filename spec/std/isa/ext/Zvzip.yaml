# yaml-language-server: $schema=../../../schemas/ext_schema.json

$schema: "ext_schema.json#"
kind: extension
name: Zvzip
long_name: Vector Extension for Reordering Structured Data
type: unprivileged
versions:
  - version: "0.3.0"
    state: development
    repositories:
      - url: https://github.com/ptomsich/riscv-isa-manual.git
        branch: zvzip
requirements:
  extension:
    name: Zve32x
description: |
  The `Zvzip` extension provides vector instructions for reordering structured
  data in vector registers: interleaving and deinterleaving element sequences,
  and pairwise transposition of elements from two vector register groups.
  These operations support packing and unpacking structured data and
  transposing small matrices.

  The extension defines `vzip.vv`, `vunzipe.v`, `vunzipo.v`, `vpaire.vv`,
  and `vpairo.vv`. `vzip.vv` interleaves two element sequences. The unzip
  instructions extract even and odd elements, and the pair instructions
  perform even or odd pairwise transposition.

  See `$ISA_MANUAL_FORK/src/unpriv/zvzip.adoc`, anchor `ext:zvzip`, and the
  instruction anchors `insns-vzip`, `insns-vunzipe`, `insns-vunzipo`,
  `insns-vpaire`, and `insns-vpairo`.
