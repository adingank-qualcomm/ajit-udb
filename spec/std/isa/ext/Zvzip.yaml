# yaml-language-server: $schema=../../../schemas/ext_schema.json

$schema: "ext_schema.json#"
kind: extension
name: Zvzip
long_name: Vector Extension for Reordering Structured Data
type: unprivileged
versions:
  - version: "0.3.0"
    state: development
    repositories:
      - url: https://github.com/ptomsich/riscv-isa-manual.git
        branch: zvzip
requirements:
  extension:
    name: Zve32x
description: |
  The `Zvzip` extension provides vector instructions for reordering structured
  data in vector registers: interleaving and deinterleaving element sequences,
  and pairwise transposition of elements from two vector register groups.
  These operations support packing and unpacking structured data and
  transposing small matrices.

  This extension is Draft and has not been ratified. The instruction encodings
  in version 0.3 are provisional pending codepoint allocation and may change.
  `Zvzip` depends on `Zve32x`.

  All operands have `EEW=SEW`. The destination is described by `vtype` and
  `vl`, with `EMUL=LMUL`; `vzip.vv` sources use `EMUL=LMUL/2`, while
  `vunzipe.v` and `vunzipo.v` sources use `EMUL=2*LMUL`. Pair instructions
  use `EMUL=LMUL` for all operands. Standard vector alignment, masking,
  prestart, inactive, and tail handling apply to destination indices.

  If `Zvkt` is implemented, all `Zvzip` instructions shall execute with
  data-independent execution latency. Unsupported SEW/LMUL settings,
  prohibited register-group overlaps, and masked encodings of the unzip
  instructions raise illegal-instruction exceptions.

  The extension defines `vzip.vv`, `vunzipe.v`, `vunzipo.v`, `vpaire.vv`,
  and `vpairo.vv`. `vzip.vv` interleaves two half-EMUL sources. The unzip
  instructions extract even and odd elements from a source with twice the
  destination EMUL. The pair instructions interleave even or odd elements
  from two same-EMUL sources without changing the element count.

  See `$ISA_MANUAL_FORK/src/unpriv/zvzip.adoc`, anchor `ext:zvzip`, and the
  instruction anchors `insns-vzip`, `insns-vunzipe`, `insns-vunzipo`,
  `insns-vpaire`, and `insns-vpairo`.
