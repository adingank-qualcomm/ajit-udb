# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmv.v.i
long_name: Vector move immediate to vector register
description: |
  Copies a sign-extended 5-bit immediate value to all body elements of the destination
  vector register group. This is an unmasked instruction (vm=1).

  The 5-bit immediate (simm[4:0]) is sign-extended to SEW bits and written to each
  body element of the destination vector register group (elements from vstart to vl-1).
  Prestart elements (indices less than vstart) are unchanged.
  Tail elements (indices >= vl) are handled according to the tail agnostic/undisturbed policy.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, imm
encoding:
  match: 010111100000-----011-----1010111
  variables:
    - name: imm
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  # vmv.v.i: Copy sign-extended 5-bit immediate to all body elements of vd

  # Raise IllegalInstruction if V extension is not implemented
  if (implemented?(ExtensionName::V) && (CSR[misa].V == 1'b0)) {
    raise (ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  # Get current vector configuration state
  VectorState state = vector_state();
  VectorLmulType lmul_type = state.lmul_type;

  # Sign-extend the 5-bit immediate to XLEN bits (SEW-wide value written per element)
  XReg sext_imm = $signed(imm);

  # Iterate over body elements: from vstart up to (but not including) vl
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    # Compute the bit range for element i within the vector register
    U32 start_bit_pos = i * state.sew;
    U32 end_bit_pos = start_bit_pos + state.sew - 1;

    # Write sign-extended immediate truncated to SEW bits into element i of vd
    V[vd][end_bit_pos:start_bit_pos] = sext_imm[state.sew-1:0];
  }

  # Clear vstart after instruction completes
  CSR[vstart].VALUE = 0;
