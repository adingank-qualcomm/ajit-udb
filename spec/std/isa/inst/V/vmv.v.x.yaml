# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmv.v.x
long_name: "Vector scalar to vector move"
description: |
  Broadcasts scalar register xs1 to all elements of vector register vd, using vector mask vm. This operation creates a vector with identical elements.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, xs1
encoding:
  match: 010111100000-----100-----1010111
  variables:
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  # Get current vector state
  VectorState state = vector_state();
  VectorLmulType lmul_type = state.lmul_type;

  XReg vlen = VLEN;
  XReg vlmax;
  if (lmul_type == VectorLmulType::Multiply) {
    vlmax = (vlen << state.log2_lmul) >> state.log2_sew;
  } else {
    # (lmul_type == VectorLmulType::Divide)
    vlmax = (vlen >> state.log2_lmul) >> state.log2_sew;
  }

  # Read scalar register xs1; lower SEW bits will be broadcast to each element
  XReg scalar_val = X[xs1];

  # Iterate through elements from vstart to vl, broadcasting scalar -> vd[i]
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    U32 start_bit_pos = i * state.sew;
    U32 end_bit_pos = start_bit_pos + state.sew - 1;

    # Truncate scalar to SEW bits (lower SEW bits of xs1) and write to element i
    V[vd][end_bit_pos:start_bit_pos] = scalar_val[state.sew-1:0];
  }

  CSR[vstart].VALUE = 0;
